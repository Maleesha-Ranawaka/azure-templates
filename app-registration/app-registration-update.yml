# =============================================================================
# TEMPLATE: app-registration-update.yml
# LOCATION:  common-repo/templates/azure/app-registration-update.yml
# USAGE:
#   - template: templates/azure/app-registration-update.yml@common
#     parameters:
#       serviceConnection: 'your-service-connection'
#       appRegReferenceName: 'myapp-prod'
#       appRegKeyName: 'myapp-prod-key'
#       environment: 'prod'
# =============================================================================

parameters:

  # ── Required ──────────────────────────────────────────────────────────────

  - name: serviceConnection
    type: string
    displayName: 'Azure Service Connection'

  - name: appRegReferenceName
    type: string
    displayName: 'App Registration reference name'

  - name: appRegKeyName
    type: string
    displayName: 'App Registration key name to update'

  - name: environment
    type: string
    displayName: 'Target environment (dev | test | staging | prod)'

  # ── Optional ──────────────────────────────────────────────────────────────

  - name: appRegJsonFile
    type: string
    displayName: 'Path to updated App Registration JSON file (if updating app config)'
    default: ''

  - name: keyNeverExpire
    type: boolean
    displayName: 'Set key to never expire'
    default: false

steps:
  - task: AzureCLI@2
    displayName: 'AAD Update App Registration Key: ${{ parameters.appRegKeyName }}'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $app = az ad app list `
          --display-name "${{ parameters.appRegReferenceName }}" `
          --query "[0].{appId:appId, id:id}" `
          --output json | ConvertFrom-Json

        if (-not $app) {
          Write-Error "App Registration '${{ parameters.appRegReferenceName }}' not found."
          exit 1
        }

        Write-Host "Found App Registration. AppId: $($app.appId)"
        Write-Host "##vso[task.setvariable variable=APP_ID]$($app.appId)"
        Write-Host "##vso[task.setvariable variable=APP_OBJECT_ID]$($app.id)"

  - task: AzureCLI@2
    displayName: 'AAD Rotate/Update Key: ${{ parameters.appRegKeyName }}'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $cmd = "az ad app credential reset" +
               " --id `"$(APP_ID)`"" +
               " --display-name `"${{ parameters.appRegKeyName }}`"" +
               " --append"

        ${{ if eq(parameters.keyNeverExpire, false) }}:
          $endDate = (Get-Date).AddYears(1).ToString("yyyy-MM-dd")
          $cmd += " --end-date `"$endDate`""

        $result = Invoke-Expression $cmd | ConvertFrom-Json

        Write-Host "Key '${{ parameters.appRegKeyName }}' updated for environment '${{ parameters.environment }}'."
        Write-Host "##vso[task.setvariable variable=APP_CLIENT_SECRET;issecret=true]$($result.password)"

  - ${{ if ne(parameters.appRegJsonFile, '') }}:
    - task: AzureCLI@2
      displayName: 'AAD Update App Registration Config from JSON'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          az ad app update `
            --id "$(APP_ID)" `
            --set "@${{ parameters.appRegJsonFile }}"

          Write-Host "App Registration config updated from JSON file."
