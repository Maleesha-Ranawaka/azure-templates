# =============================================================================
# TEMPLATE: log-analytics-role-assignment.yml
# LOCATION:  common-repo/templates/azure/log-analytics-role-assignment.yml
# USAGE:
#   - template: templates/azure/log-analytics-role-assignment.yml@common
#     parameters:
#       serviceConnection: 'your-service-connection'
#       appId: '$(LogAnalyticsAppId)'
#       logAnalyticsWorkspaceResourceId: '$(LogAnalyticsWorkspaceResourceId)'
#       role: 'Contributor'
# =============================================================================

parameters:
  - name: serviceConnection
    type: string
    displayName: 'Azure Service Connection'

  - name: appId
    type: string
    displayName: 'App Registration App ID to assign role'

  - name: logAnalyticsWorkspaceResourceId
    type: string
    displayName: 'Log Analytics Workspace Resource ID (full ARM resource ID)'

  - name: role
    type: string
    displayName: 'Role to assign (e.g. Reader | Contributor | Monitoring Reader | Monitoring Contributor | Log Analytics Contributor | Log Analytics Reader)'
    default: 'Reader'

steps:
  - task: AzureCLI@2
    displayName: 'Grant ${{ parameters.role }} Permission to Log Analytics Workspace'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        $azureSubscriptionId = (ConvertFrom-Json([string](az account get-access-token))).subscription
        az account set --subscription "$azureSubscriptionId"

        $msiResourceObj = az ad sp show --id "${{ parameters.appId }}" | ConvertFrom-Json

        az role assignment create `
          --assignee-object-id $msiResourceObj.id `
          --assignee-principal-type "ServicePrincipal" `
          --role "${{ parameters.role }}" `
          --scope "${{ parameters.logAnalyticsWorkspaceResourceId }}"

        Write-Host "'${{ parameters.role }}' role assigned to AppId '${{ parameters.appId }}' on Log Analytics Workspace."
