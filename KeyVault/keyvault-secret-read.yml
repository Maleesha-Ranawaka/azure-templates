
parameters:
  - name: serviceConnection
    type: string
    displayName: 'Azure Service Connection'

  - name: keyVaultName
    type: string
    displayName: 'Key Vault Name'

  - name: secrets
    type: object
    displayName: 'List of secret names to read'

steps:
  - ${{ each secret in parameters.secrets }}:
    - task: AzureCLI@2
      displayName: 'KV Get Secret: ${{ secret }}'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $value = az keyvault secret show `
            --vault-name "${{ parameters.keyVaultName }}" `
            --name "${{ secret }}" `
            --query "value" `
            --output tsv

          Write-Host "##vso[task.setvariable variable=${{ secret }};issecret=true]$value"
