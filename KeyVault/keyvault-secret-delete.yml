
parameters:
  - name: serviceConnection
    type: string
    displayName: 'Azure Service Connection'

  - name: keyVaultName
    type: string
    displayName: 'Key Vault Name'

  - name: secrets
    type: object
    displayName: 'List of secret names to delete'

steps:
  - ${{ each secret in parameters.secrets }}:
    - task: AzureCLI@2
      displayName: 'KV Delete Secret: ${{ secret }}'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          az keyvault secret delete `
            --vault-name "${{ parameters.keyVaultName }}" `
            --name "${{ secret }}"
