# =============================================================================
# TEMPLATE: keyvault-secret-create-minimal.yml
# LOCATION:  common-repo/templates/azure/keyvault-secret-create-minimal.yml
# USAGE:
#   - template: templates/azure/keyvault-secret-create-minimal.yml@common
#     parameters:
#       serviceConnection: 'your-service-connection'
#       keyVaultName: 'kv-myapp-prod'
#       secrets:
#         - name: 'MyApiKey'
#           value: $(MY_API_KEY)
# =============================================================================

parameters:
  - name: serviceConnection
    type: string
    displayName: 'Azure Service Connection'

  - name: keyVaultName
    type: string
    displayName: 'Key Vault Name'

  - name: secrets
    type: object
    displayName: 'List of secrets (name + value)'

steps:
  - ${{ each secret in parameters.secrets }}:
    - task: AzureCLI@2
      displayName: 'KV Set Secret: ${{ secret.name }}'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          az keyvault secret set `
            --vault-name "${{ parameters.keyVaultName }}" `
            --name "${{ secret.name }}" `
            --value "${{ secret.value }}"
