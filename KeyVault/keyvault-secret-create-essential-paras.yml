# =============================================================================
# TEMPLATE: keyvault-secret-create.yml
# LOCATION:  common-repo/templates/azure/keyvault-secret-create.yml
# USAGE:
#   - template: templates/azure/keyvault-secret-create.yml@common
#     parameters:
#       serviceConnection: 'your-service-connection'
#       keyVaultName: 'kv-myapp-prod'
#       secrets:
#         - name: 'MyApiKey'
#           value: $(MY_API_KEY)
# =============================================================================

parameters:

  # ── Required ──────────────────────────────────────────────────────────────

  - name: serviceConnection
    type: string
    displayName: 'Azure Service Connection'

  - name: keyVaultName
    type: string
    displayName: 'Key Vault Name'

  - name: secrets
    type: object
    displayName: 'List of secrets (name + value)'
    default: []

  # ── Optional ──────────────────────────────────────────────────────────────

  - name: expiresInDays
    type: number
    displayName: 'Secret expiry in days (0 = never expires)'
    default: 0

  - name: contentType
    type: string
    displayName: 'Content type of the secret value (e.g. text/plain, application/json)'
    default: 'text/plain'

  - name: enabled
    type: boolean
    displayName: 'Whether the secret is enabled after creation'
    default: true

  - name: tags
    type: string
    displayName: 'Space-separated tags (e.g. "env=prod team=backend")'
    default: ''

# =============================================================================

steps:

  - ${{ if gt(parameters.expiresInDays, 0) }}:
    - task: PowerShell@2
      displayName: 'KV: Calculate secret expiry date'
      inputs:
        targetType: inline
        script: |
          $expiry = (Get-Date).AddDays(${{ parameters.expiresInDays }}).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          Write-Host "##vso[task.setvariable variable=KV_SECRET_EXPIRY]$expiry"

  - ${{ each secret in parameters.secrets }}:
    - task: AzureCLI@2
      displayName: 'KV Set Secret: ${{ secret.name }}'
      inputs:
        azureSubscription: '${{ parameters.serviceConnection }}'
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $cmd = "az keyvault secret set" +
                 " --vault-name `"${{ parameters.keyVaultName }}`"" +
                 " --name `"${{ secret.name }}`"" +
                 " --value `"${{ secret.value }}`"" +
                 " --content-type `"${{ parameters.contentType }}`"" +
                 " --disabled `"$([string](-not [System.Convert]::ToBoolean('${{ parameters.enabled }}')))`""

          if ("${{ parameters.tags }}" -ne "") {
            $cmd += " --tags ${{ parameters.tags }}"
          }

          if ("$(KV_SECRET_EXPIRY)" -ne "" -and "$(KV_SECRET_EXPIRY)" -ne "`$(KV_SECRET_EXPIRY)") {
            $cmd += " --expires `"$(KV_SECRET_EXPIRY)`""
          }

          Invoke-Expression $cmd
